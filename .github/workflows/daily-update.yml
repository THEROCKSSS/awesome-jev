name: Daily catalog update
on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Scrape + refresh catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_list.py
      - name: Regenerate README list section
        run: python scripts/gen_readme.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily catalog update"
          file_pattern: data/jev.json README.md
