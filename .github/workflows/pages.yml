name: Deploy page
on:
  schedule:
    - cron: '47 6 * * *'   # daily 06:47 UTC, after the 06:17 catalog update
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment: { name: github-pages, url: https://therocksss.github.io/awesome-jev/ }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }
      - uses: actions/deploy-pages@v4
